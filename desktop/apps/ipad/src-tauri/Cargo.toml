[package]
name = "mps-ipad"
version = "0.2.3"
edition = "2021"
publish = false
[lib]
name = "mps_ipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.0", features = [] }
[features]
custom-protocol = ["tauri/custom-protocol"]
